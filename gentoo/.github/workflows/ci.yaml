name: Gentoo Desktop OpenRC AMD64

# This file is mirrored into metacraft-labs/metacraft-overlay from
# metacraft-desktop-packages/gentoo/ — edit it there, not in the overlay.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gentoo-job:
    # `ephemeral`: a `container:` job needs the stock runner + dockerd of the
    # ephemeral GARM image. The persistent NixOS runners have no docker.
    runs-on: [self-hosted, linux, x64, ephemeral]
    timeout-minutes: 120
    container:
      image: gentoo/stage3:desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Synchronise the Gentoo repository
        run: emerge-webrsync || emerge --sync
      - name: Register this checkout as the metacraft-overlay repository
        run: |
          set -eu
          mkdir -p /etc/portage/repos.conf
          printf '[metacraft-overlay]\nlocation = %s\nauto-sync = no\n' "$GITHUB_WORKSPACE" \
            > /etc/portage/repos.conf/metacraft-overlay.conf
          chown -R portage:portage "$GITHUB_WORKSPACE" || true
          portageq get_repo_path / metacraft-overlay
      - name: Verify the Manifests match the published distfiles
        run: |
          set -eu
          for ebuild in dev-debug/codetracer-bin/*.ebuild; do
            echo "Checking ${ebuild}"
            # `ebuild ... fetch` downloads every DIST entry and checks it against
            # the committed Manifest; a stale or wrong digest fails here.
            ebuild "$GITHUB_WORKSPACE/${ebuild}" fetch
          done
      - name: Install codetracer-bin
        run: |
          set -eu
          emerge --getbinpkg --usepkg --quiet-build=y dev-debug/codetracer-bin::metacraft-overlay \
            || emerge --quiet-build=y dev-debug/codetracer-bin::metacraft-overlay
      - name: Smoke test
        run: |
          set -eu
          # Containers have no /dev/fuse; let the AppImage extract itself instead.
          APPIMAGE_EXTRACT_AND_RUN=1 ct --version
