name: Test package publisher

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  choose:
    uses: metacraft-labs/devops-modules/.github/workflows/reusable-choose-runner.yml@cd73eba732b9190499ec78e1e65b0dd784507440
    with:
      preferred: ubuntu-24.04
      fallback: '["self-hosted","linux","x64"]'
  test:
    needs: choose
    runs-on: ${{ fromJSON(needs.choose.outputs.runs_on) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: metacraft-labs/metacraft-github-actions/setup-nix@7f7bc6acd818fa88cde01a5985977e4c818c7eaa
        with:
          gh-token: ${{ github.token }}
      - name: Validate workflows and shell
        run: |
          nix shell nixpkgs#actionlint nixpkgs#shellcheck nixpkgs#python3 -c python3 scripts/check-publisher-workflows.py
          nix shell nixpkgs#shellcheck -c shellcheck scripts/publish-into-repositories.sh scripts/verify-tool-release.sh scripts/validate-publish-request.sh scripts/publish-homebrew-tap.sh scripts/setup-homebrew-verification.sh
      - name: Test Homebrew publication with actual released archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for app in gosti io-mon runquota; do
            gh release download v0.1.0 -R "metacraft-labs/$app" -D "$app-macos-release" \
              -p '*-darwin-aarch64.tar.gz' -p SHA256SUMS
            nix shell nixpkgs#python3 -c python3 scripts/test-homebrew-formula.py \
              --config "homebrew/$app.json" --release-dir "$app-macos-release"
          done
      - name: Test Scoop manifest generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A real release too: its Windows zip, as the publisher downloads it.
          gh release download v0.2.5 -R metacraft-labs/reprobuild -D reprobuild-release \
            -p 'reprobuild-*-windows-x86_64.zip' -p SHA256SUMS
          nix shell nixpkgs#python3 -c python3 scripts/test-scoop-manifest.py \
            --release-dir reprobuild-release --config scoop/reprobuild.json
      - name: Test real archives and repository signatures
        run: |
          nix shell nixpkgs#reprepro nixpkgs#dpkg nixpkgs#rpm nixpkgs#createrepo_c nixpkgs#gnupg nixpkgs#python3 -c python3 scripts/test-package-publisher.py --apt-client
