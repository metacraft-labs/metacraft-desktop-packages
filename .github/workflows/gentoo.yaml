name: Synchronise Gentoo overlay
on:
  push:
    branches: [dev]
    paths:
      - "gentoo/**"
      - ".github/workflows/gentoo.yaml"
  workflow_dispatch:

concurrency:
  group: gentoo-overlay-sync
  cancel-in-progress: false

env:
  OVERLAY: metacraft-labs/metacraft-overlay
  # The overlay's mainline. Its `dev` ruleset requires a pull request, so the
  # sync lands through one (merge commit) instead of a direct push.
  OVERLAY_BRANCH: dev

jobs:
  gentoo:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: "Import bot's GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Mint credentials scoped to the overlay
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          repositories: metacraft-overlay
          permission-contents: write
          permission-pull-requests: write
      - name: Mirror gentoo/ onto a sync branch of the overlay
        id: sync
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          src="$GITHUB_WORKSPACE/gentoo"
          dst="$RUNNER_TEMP/overlay"
          rm -rf "$dst"
          git clone --branch "$OVERLAY_BRANCH" \
            "https://x-access-token:${TOKEN}@github.com/${OVERLAY}" "$dst"

          # The overlay is an exact mirror of gentoo/: replace the whole tree.
          find "$dst" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$src"/. "$dst"/

          cd "$dst"
          git add -A
          if git diff --cached --quiet; then
            echo "Overlay ${OVERLAY_BRANCH} already matches gentoo/"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git status --short
          branch="sync/desktop-packages-${SOURCE_SHA:0:12}"
          git checkout -b "$branch"
          git commit -m "Synchronise with metacraft-desktop-packages@${SOURCE_SHA:0:12}"
          git push --force origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Land the sync branch on the overlay mainline
        if: steps.sync.outputs.branch != ''
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const [owner, repo] = process.env.OVERLAY.split('/');
            const head = process.env.BRANCH;
            const base = process.env.OVERLAY_BRANCH;
            const existing = await github.rest.pulls.list({ owner, repo, head: `${owner}:${head}`, base, state: 'open' });
            const pr = existing.data[0] ?? (await github.rest.pulls.create({
              owner, repo, head, base,
              title: `Synchronise with metacraft-desktop-packages@${process.env.SOURCE_SHA.slice(0, 12)}`,
              body: `Automated mirror of \`gentoo/\` from ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${process.env.SOURCE_SHA}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })).data;
            core.info(`PR: ${pr.html_url}`);
            const merged = await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'merge' });
            core.info(`Merged ${merged.data.sha}`);
            await github.rest.git.deleteRef({ owner, repo, ref: `heads/${head}` }).catch(e => core.warning(`branch cleanup: ${e.message}`));
