name: Verify the Scoop bucket on Windows

# Installs a product through Scoop on a real Windows machine, exactly as a user
# would, and checks that the installed command reports the manifest's version.
#
# - On a pull request that touches the bucket machinery, the manifest is
#   GENERATED by scripts/scoop-manifest.py into a throwaway local bucket, so the
#   generator's output is proven installable before it can reach users. The
#   archive is the organisation Reprobuild pin's Windows bundle
#   (pins/reprobuild.json in metacraft-github-actions, at the `dev` its actions
#   are used from), published there as the prerelease pin-<rev>. The manifest
#   downloads from that prerelease and carries the hash its SHA256SUMS lists,
#   so the Scoop install checks the download against the pin's own sums. This
#   repository names no Reprobuild revision or tag.
# - Dispatched by hand, it adds the LIVE bucket
#   (https://github.com/metacraft-labs/metacraft-desktop-packages) and installs
#   from it, or, with `generate`, runs the pull-request leg instead. With
#   `installer_url` it also runs a product's `irm <url> | iex` installer on a
#   second, clean machine.
#
# GitHub-hosted windows-latest: the public repository runs it at no cost, and
# no self-hosted Windows runner is needed for a check this small.
on:
  pull_request:
    branches: [dev]
    paths:
      - bucket/**
      - scoop/**
      - scripts/scoop-manifest.py
      - .github/workflows/verify-scoop-bucket.yaml
  workflow_dispatch:
    inputs:
      app:
        description: Manifest to install (bucket/<app>.json)
        default: reprobuild
        required: true
      command:
        description: Installed command that must print the manifest version for --version
        default: repro
        required: true
      installer_url:
        description: Optional `irm <url> | iex` installer to run too (e.g. https://get.reprobuild.com/pwsh)
        required: false
      generate:
        description: Install a bucket generated from the Reprobuild pin's prerelease (the pull-request leg) instead of the live bucket
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scoop-install:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      APP: ${{ inputs.app || 'reprobuild' }}
      COMMAND: ${{ inputs.command || 'repro' }}
      GENERATE: ${{ github.event_name == 'pull_request' || inputs.generate }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          # Hosted runners are elevated; Scoop's installer requires opting in.
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          "$env:USERPROFILE\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Generate a bucket from the Reprobuild pin's prerelease
        if: env.GENERATE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APP -ne 'reprobuild') { throw "a generated bucket holds reprobuild only, not $env:APP" }
          $pin = gh api -H 'Accept: application/vnd.github.raw' `
            'repos/metacraft-labs/metacraft-github-actions/contents/pins/reprobuild.json?ref=dev' | ConvertFrom-Json
          if ($LASTEXITCODE) { exit 1 }
          if ($pin.rev -notmatch '^[0-9a-f]{40}$') { throw "pins/reprobuild.json rev is not a commit: $($pin.rev)" }
          $tag = "pin-$($pin.rev)"
          $asset = "reprobuild-$($pin.version)-windows-x86_64.zip"
          Write-Host "Reprobuild pin $($pin.version) ($($pin.rev)): $tag/$asset"
          $release = "$env:RUNNER_TEMP\release"
          gh release download $tag -R metacraft-labs/metacraft-github-actions -D $release `
            -p $asset -p SHA256SUMS
          if ($LASTEXITCODE) { exit 1 }
          $urlBase = "https://github.com/metacraft-labs/metacraft-github-actions/releases/download/$tag"
          $bucket = "$env:RUNNER_TEMP\bucket-repo"
          git init -q $bucket
          python scripts/scoop-manifest.py --config scoop/reprobuild.json --tag "v$($pin.version)" `
            --release-dir $release --bucket "$bucket\bucket" --url-base $urlBase
          if ($LASTEXITCODE) { exit 1 }
          Get-Content "$bucket\bucket\reprobuild.json"
          # The manifest must send Scoop to the prerelease, with the hash the
          # prerelease's SHA256SUMS lists for that archive.
          $line = "^([0-9a-f]{64}) [ *]$([regex]::Escape($asset))$"
          $sums = @(Get-Content "$release\SHA256SUMS" | ForEach-Object { if ($_ -match $line) { $Matches[1] } })
          if ($sums.Count -ne 1) { throw "SHA256SUMS lists $asset $($sums.Count) times" }
          $hash = $sums[0]
          $entry = (Get-Content "$bucket\bucket\reprobuild.json" -Raw | ConvertFrom-Json).architecture.'64bit'
          if ($entry.url -ne "$urlBase/$asset") { throw "manifest url $($entry.url), expected $urlBase/$asset" }
          if ($entry.hash -ne $hash) { throw "manifest hash $($entry.hash), SHA256SUMS says $hash" }
          "EXPECTED_HASH=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          git -C $bucket add bucket
          git -C $bucket -c user.name=ci -c user.email=ci@example.invalid commit -q -m bucket
          # Scoop validates the URL with `git ls-remote`, which wants forward slashes.
          "BUCKET_URL=$($bucket -replace '\\','/')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Use the live bucket (dispatch)
        if: env.GENERATE != 'true'
        shell: pwsh
        run: |
          "BUCKET_URL=https://github.com/metacraft-labs/metacraft-desktop-packages" |
            Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: scoop bucket add, scoop install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop bucket add metacraft $env:BUCKET_URL
          if ($LASTEXITCODE) { exit 1 }
          scoop install "metacraft/$env:APP"
          if ($LASTEXITCODE) { exit 1 }
          $manifest = Get-Content "$env:USERPROFILE\scoop\buckets\metacraft\bucket\$env:APP.json" -Raw | ConvertFrom-Json
          "EXPECTED_VERSION=$($manifest.version)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if ($env:EXPECTED_HASH) {
            # Scoop refuses a download whose sha256 is not the manifest's, so a
            # completed install means the archive matched; confirm Scoop
            # installed the manifest the pin's SHA256SUMS hash was written into.
            $installed = Get-Content "$env:USERPROFILE\scoop\apps\$env:APP\current\manifest.json" -Raw | ConvertFrom-Json
            if ($installed.architecture.'64bit'.hash -ne $env:EXPECTED_HASH) {
              throw "installed manifest hash $($installed.architecture.'64bit'.hash), expected $env:EXPECTED_HASH"
            }
            Write-Host "OK: Scoop installed the archive with sha256 $env:EXPECTED_HASH"
          }

      - name: The installed command reports the manifest version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = Get-Command $env:COMMAND
          Write-Host "$env:COMMAND resolves to $($found.Source)"
          $out = & $env:COMMAND --version
          Write-Host "$env:COMMAND --version: $out"
          if ($LASTEXITCODE) { throw "$env:COMMAND --version exited $LASTEXITCODE" }
          if ("$out" -notmatch "(^|\s)$([regex]::Escape($env:EXPECTED_VERSION))(\s|$)") {
            throw "expected version $env:EXPECTED_VERSION, got: $out"
          }
          scoop list
          Write-Host "OK: $env:APP $env:EXPECTED_VERSION installed through Scoop"

  installer:
    if: inputs.installer_url
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      COMMAND: ${{ inputs.command }}
      INSTALLER_URL: ${{ inputs.installer_url }}
    steps:
      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          "$env:USERPROFILE\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: irm <installer_url> | iex
        shell: pwsh
        run: |
          # The installer ends with `exit`, which ends this step's session, so
          # the result is checked in the next step.
          Invoke-RestMethod $env:INSTALLER_URL | Invoke-Expression

      - name: The installed command runs, from the org bucket
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop bucket list
          $remote = git -C "$env:USERPROFILE\scoop\buckets\metacraft" remote get-url origin
          Write-Host "bucket 'metacraft' -> $remote"
          if ($remote -ne 'https://github.com/metacraft-labs/metacraft-desktop-packages') {
            throw "the installer registered $remote, not the organisation bucket"
          }
          $out = & $env:COMMAND --version
          Write-Host "$env:COMMAND --version: $out"
          if ($LASTEXITCODE) { throw "$env:COMMAND --version exited $LASTEXITCODE" }
          scoop list
