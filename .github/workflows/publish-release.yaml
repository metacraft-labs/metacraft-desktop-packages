name: Publish a release into the org repositories

# Adds one product release's .deb and .rpm assets to deb.metacraft-labs.com and
# rpm.metacraft-labs.com (the same buckets deb./rpm.codetracer.com serve), and
# its Windows zip to the organisation's Scoop bucket, bucket/ in this
# repository (the `scoop` job below), and its macOS archive to the shared
# Homebrew tap after a real native installation test.
#
# Products build their own packages from their release payload and attach them
# to their GitHub Release; after the Release is published they dispatch this
# workflow. The signing key and the bucket credentials live only here.
# See metacraft-specs infrastructure/package-distribution.md §9.1.
on:
  repository_dispatch:
    types: [publish-release]
  workflow_dispatch:
    inputs:
      repository:
        description: Product repository, owner/name (e.g. metacraft-labs/reprobuild)
        required: true
      tag:
        description: Release tag (e.g. v0.2.0)
        required: true

permissions:
  contents: read

# One publisher at a time for every product, and never cancelled: each run
# regenerates the indices over the whole repository, so two concurrent runs
# would each upload an index missing the other's packages, and a cancelled
# run could leave packages uploaded with no index naming them.
concurrency:
  group: org-package-repositories
  cancel-in-progress: false
  queue: max

jobs:
  homebrew:
    # Same serial queue as apt/RPM/Scoop. Terraform owns the tap's repository,
    # branches and protections; this job publishes only reviewed release data.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate the request and find its formula config
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/validate-publish-request.sh
          config="homebrew/${REPOSITORY#*/}.json"
          if [ ! -f "$config" ]; then
            echo "::notice::$REPOSITORY has no $config; nothing to publish to Homebrew"
            exit 0
          fi
          if [ "$(gh release view "$TAG" -R "$REPOSITORY" --json isPrerelease -q .isPrerelease)" = true ]; then
            echo '::notice::Homebrew publishes stable releases only'
            exit 0
          fi
          echo "path=$config" >> "$GITHUB_OUTPUT"
      - name: Mint credentials scoped to the shared tap
        id: token
        if: steps.config.outputs.path
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          repositories: homebrew-metacraft
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v6
        if: steps.config.outputs.path
        with:
          repository: metacraft-labs/homebrew-metacraft
          ref: dev
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
          path: published-tap
      - name: Generate and verify the formula through Homebrew
        if: steps.config.outputs.path
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG: ${{ steps.config.outputs.path }}
        run: |
          set -euo pipefail
          app=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["app"])' "$CONFIG")
          # $version is the config's literal template placeholder, expanded by Python.
          # shellcheck disable=SC2016
          asset=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["asset"].replace("$version", sys.argv[2].removeprefix("v")))' "$CONFIG" "$TAG")
          gh release download "$TAG" -R "$REPOSITORY" -D incoming-macos -p "$asset" -p SHA256SUMS
          python3 scripts/homebrew-formula.py --config "$CONFIG" --tag "$TAG" \
            --release-dir incoming-macos --tap published-tap
          python3 scripts/verify-tool-homebrew.py --tap-path published-tap --products "$app"
          echo "app=$app" >> "$GITHUB_OUTPUT"
      - name: Promote the verified formula through dev and stable
        if: steps.config.outputs.path
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP: ${{ steps.formula.outputs.app }}
        run: bash scripts/publish-homebrew-tap.sh published-tap

  choose:
    # Owner: zah. Follow-up: metacraft-specs/issues/
    # 2026-09-24-ci-runner-mode-policy-conflicts-with-hosted-runner-ban.md
    uses: metacraft-labs/devops-modules/.github/workflows/reusable-choose-runner.yml@cd73eba732b9190499ec78e1e65b0dd784507440
    with:
      preferred: ubuntu-24.04
      fallback: '["self-hosted","linux","x64"]'

  publish:
    needs: choose
    runs-on: ${{ fromJSON(needs.choose.outputs.runs_on) }}
    timeout-minutes: 60
    env:
      REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate the request
        run: ./scripts/validate-publish-request.sh

      - name: Set up Nix
        uses: metacraft-labs/metacraft-github-actions/setup-nix@7f7bc6acd818fa88cde01a5985977e4c818c7eaa
        with:
          gh-token: ${{ github.token }}

      - name: Download and verify the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir incoming
          gh release download "$TAG" -R "$REPOSITORY" -D incoming \
            -p '*.deb' -p '*.rpm' -p SHA256SUMS
          cd incoming
          shopt -s nullglob
          pkgs=(*.deb *.rpm)
          [ ${#pkgs[@]} -gt 0 ] || { echo "::error::$REPOSITORY $TAG has no .deb or .rpm assets"; exit 1; }
          # Every package must be covered by the release's SHA256SUMS; a
          # package the release did not account for is not published.
          for f in "${pkgs[@]}"; do
            grep -E "^[0-9a-f]{64}  \*?${f//./\\.}\$" SHA256SUMS > /dev/null \
              || { echo "::error::$f is not listed in SHA256SUMS"; exit 1; }
          done
          grep -E "  \*?($(printf '%s|' "${pkgs[@]}" | sed 's/\./\\./g; s/|$//'))\$" SHA256SUMS | sha256sum -c -
          rm SHA256SUMS

      - name: Sync the published repositories down
        env:
          DEB_AWS_ACCESS_KEY_ID: ${{ secrets.CODETRACER_DEB_BUCKET_ACCESS_KEY_ID }}
          DEB_AWS_SECRET_ACCESS_KEY: ${{ secrets.CODETRACER_DEB_BUCKET_ACCESS_KEY }}
          DEB_ENDPOINT: ${{ secrets.CODETRACER_DEB_BUCKET_S3_URL }}
          RPM_AWS_ACCESS_KEY_ID: ${{ secrets.CODETRACER_RPM_BUCKET_ACCESS_KEY_ID }}
          RPM_AWS_SECRET_ACCESS_KEY: ${{ secrets.CODETRACER_RPM_ACCESS_KEY }}
          RPM_ENDPOINT: ${{ secrets.CODETRACER_RPM_BUCKET_S3_URL }}
        run: |
          set -euo pipefail
          # Bucket variables expand in the inner shell.
          # shellcheck disable=SC2016
          nix shell nixpkgs#awscli2 -c sh -c '
            AWS_ACCESS_KEY_ID=$DEB_AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$DEB_AWS_SECRET_ACCESS_KEY \
              aws --endpoint-url="$DEB_ENDPOINT" s3 sync "s3://${{ vars.DEB_CODETRACER_BUCKET_NAME }}/pool/" repo-deb/pool/ --only-show-errors
            AWS_ACCESS_KEY_ID=$RPM_AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$RPM_AWS_SECRET_ACCESS_KEY \
              aws --endpoint-url="$RPM_ENDPOINT" s3 sync "s3://${{ vars.RPM_CODETRACER_BUCKET_NAME }}/" repo-rpm/ \
                --exclude "repodata/*" --exclude "*" --include "RPMS/*" --include "SRPMS/*" --only-show-errors
          '
          mkdir -p repo-deb/pool repo-rpm

      - name: Import the repository signing key
        id: key
        env:
          # The dedicated package-repository key, sealed in infra's
          # terraform/github/secrets-metacraft-prod and projected to this
          # repository only. It has no passphrase: the age envelope and the
          # Actions secret store are what protect it.
          SIGNING_KEY: ${{ secrets.METACRAFT_REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          fpr="$(nix shell nixpkgs#gnupg -c ./scripts/import-signing-key.sh)"
          # The organisation's repository key, pinned by every installer.
          [ "$fpr" = "22F80A4A65B08E36AEA89F57E127BF3AC4CE1719" ] \
            || { echo "::error::signing key is $fpr, not the pinned organisation key"; exit 1; }
          # keys/ is what installers pin by digest and what apt/dnf trust; it
          # must hold exactly the key that is about to sign.
          committed="$(nix shell nixpkgs#gnupg -c gpg --batch --show-keys --with-colons keys/metacraft-labs-archive-keyring.gpg | awk -F: '$1=="pub"{n++} $1=="fpr" && !f{print $10; f=1} END{if(n!=1) print "MULTIPLE"}')"
          [ "$committed" = "$fpr" ] \
            || { echo "::error::keys/metacraft-labs-archive-keyring.gpg holds '$committed', not the signing key $fpr"; exit 1; }
          echo "fpr=$fpr" >> "$GITHUB_OUTPUT"

      - name: Add the packages and regenerate the indices
        run: |
          nix shell nixpkgs#reprepro nixpkgs#createrepo_c nixpkgs#rpm nixpkgs#gnupg nixpkgs#dpkg nixpkgs#python3 -c \
            ./scripts/publish-into-repositories.sh \
              --incoming incoming --deb-dir repo-deb --rpm-dir repo-rpm \
              --key-id "${{ steps.key.outputs.fpr }}"
          cp favicon.png debian/index.html repo-deb/
          cp favicon.png rpm/index.html repo-rpm/

      - name: Upload packages, then indices
        env:
          DEB_AWS_ACCESS_KEY_ID: ${{ secrets.CODETRACER_DEB_BUCKET_ACCESS_KEY_ID }}
          DEB_AWS_SECRET_ACCESS_KEY: ${{ secrets.CODETRACER_DEB_BUCKET_ACCESS_KEY }}
          DEB_ENDPOINT: ${{ secrets.CODETRACER_DEB_BUCKET_S3_URL }}
          RPM_AWS_ACCESS_KEY_ID: ${{ secrets.CODETRACER_RPM_BUCKET_ACCESS_KEY_ID }}
          RPM_AWS_SECRET_ACCESS_KEY: ${{ secrets.CODETRACER_RPM_ACCESS_KEY }}
          RPM_ENDPOINT: ${{ secrets.CODETRACER_RPM_BUCKET_S3_URL }}
        run: |
          set -euo pipefail
          # Bucket variables expand in the inner shell.
          # shellcheck disable=SC2016
          nix shell nixpkgs#awscli2 -c sh -c '
            deb() { AWS_ACCESS_KEY_ID=$DEB_AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$DEB_AWS_SECRET_ACCESS_KEY aws --endpoint-url="$DEB_ENDPOINT" "$@"; }
            rpm() { AWS_ACCESS_KEY_ID=$RPM_AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$RPM_AWS_SECRET_ACCESS_KEY aws --endpoint-url="$RPM_ENDPOINT" "$@"; }
            d="s3://${{ vars.DEB_CODETRACER_BUCKET_NAME }}"
            r="s3://${{ vars.RPM_CODETRACER_BUCKET_NAME }}"
            deb s3 sync repo-deb/pool/ "$d/pool/" --only-show-errors
            rpm s3 sync repo-rpm/RPMS/ "$r/RPMS/" --only-show-errors
            # Publish immutable indices before mutable signed entrypoints.
            # Keep older hashed files for clients holding previous metadata.
            deb s3 sync repo-deb/dists/ "$d/dists/" --exclude "*" --include "*/by-hash/*" \
              --cache-control "public,max-age=31536000,immutable" --only-show-errors
            deb s3 sync repo-deb/dists/ "$d/dists/" --exclude "*/by-hash/*" \
              --exclude "stable/Release" --exclude "stable/Release.gpg" --exclude "stable/InRelease" \
              --cache-control "no-cache" --only-show-errors
            for f in Release.gpg Release InRelease; do
              deb s3 cp "repo-deb/dists/stable/$f" "$d/dists/stable/$f" \
                --cache-control "no-cache" --only-show-errors
            done
            # The trust anchor, verbatim from this repository, under the name
            # installers use and under the names existing users already have.
            for b in deb rpm; do
              t="$d"; [ "$b" = rpm ] && t="$r"
              $b s3 cp keys/metacraft-labs-archive-keyring.gpg "$t/keys/metacraft-labs-archive-keyring.gpg" --only-show-errors
              $b s3 cp keys/metacraft-labs-archive-keyring.asc "$t/keys/metacraft-labs-archive-keyring.asc" --only-show-errors
            done
            deb s3 cp keys/metacraft-labs-archive-keyring.asc "$d/keys/public.asc" --only-show-errors
            deb s3 cp repo-deb/index.html "$d/index.html" --only-show-errors
            deb s3 cp repo-deb/favicon.png "$d/favicon.png" --only-show-errors
            rpm s3 sync repo-rpm/repodata/ "$r/repodata/" --exclude "repomd.xml" --exclude "repomd.xml.asc" \
              --cache-control "public,max-age=31536000,immutable" --only-show-errors
            for f in repomd.xml.asc repomd.xml; do
              rpm s3 cp "repo-rpm/repodata/$f" "$r/repodata/$f" \
                --cache-control "no-cache" --only-show-errors
            done
            rpm s3 cp keys/metacraft-labs-archive-keyring.asc "$r/rpmkey.pub" --only-show-errors
            rpm s3 cp repo-rpm/favicon.png "$r/favicon.png" --only-show-errors
            rpm s3 cp repo-rpm/index.html "$r/index.html" --only-show-errors
          '

      - name: Summary
        run: |
          {
            echo "### Published $REPOSITORY $TAG"
            echo
            (cd incoming && shopt -s nullglob && packages=(*.deb *.rpm) && printf -- '- %s\n' "${packages[@]}")
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: |
          [ -n "${GNUPGHOME:-}" ] && [ -d "$GNUPGHOME" ] || exit 0
          nix shell nixpkgs#gnupg -c gpgconf --kill all || true
          find "$GNUPGHOME" -type f -exec shred -u {} + 2>/dev/null || true
          rm -rf "$GNUPGHOME"

  scoop:
    # The organisation's Scoop bucket is bucket/ on this repository's default
    # branch: `scoop bucket add metacraft https://github.com/metacraft-labs/metacraft-desktop-packages`.
    # For a product with a config in scoop/<repo>.json, this verifies the
    # release's Windows zip against its SHA256SUMS and writes bucket/<app>.json
    # (scripts/scoop-manifest.py).
    #
    # How the manifest reaches the bucket, and why:
    # - It has to be the DEFAULT branch. `scoop bucket add` clones a repository
    #   without a branch argument, so a separate `bucket` branch would be
    #   invisible to every user.
    # - `dev` accepts changes only through pull requests, with no bypass. This
    #   job therefore opens a PR from scoop/<app>-<version> and merges it
    #   itself. The rule needs no approval and no status check, so nothing waits
    #   on a human, the rule is not weakened, and every bucket change is a
    #   reviewable PR in the history.
    # - It is a separate job so that only it holds a token that can write, and
    #   it never sees the signing key or the bucket credentials. It runs in the
    #   same serialized run as `publish` (the workflow-level concurrency group),
    #   so two publications never race on bucket/.
    # - It does not wait for `publish`: a Linux-repository failure does not hold
    #   back Windows users, and a release without .deb/.rpm still reaches Scoop.
    needs: choose
    runs-on: ${{ fromJSON(needs.choose.outputs.runs_on) }}
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate the request
        run: ./scripts/validate-publish-request.sh

      - name: Find the product's Scoop config
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="scoop/${REPOSITORY#*/}.json"
          if [ ! -f "$config" ]; then
            echo "::notice::$REPOSITORY has no $config; nothing to publish to Scoop"
            exit 0
          fi
          if [ "$(gh release view "$TAG" -R "$REPOSITORY" --json isPrerelease -q .isPrerelease)" = true ]; then
            echo "::notice::$REPOSITORY $TAG is a pre-release; the Scoop bucket carries releases only"
            exit 0
          fi
          echo "path=$config" >> "$GITHUB_OUTPUT"

      - name: Set up Nix
        if: steps.config.outputs.path
        uses: metacraft-labs/metacraft-github-actions/setup-nix@7f7bc6acd818fa88cde01a5985977e4c818c7eaa
        with:
          gh-token: ${{ github.token }}

      - name: Write the manifest
        id: manifest
        if: steps.config.outputs.path
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG: ${{ steps.config.outputs.path }}
        run: |
          set -euo pipefail
          # setup-nix exports a GitHub Authorization header through
          # GIT_CONFIG_*; checkout already configured one, and GitHub answers
          # two with a 400. Git here uses checkout's (this job's token).
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          mkdir incoming-windows
          if gh release view "$TAG" -R "$REPOSITORY" --json assets -q '.assets[].name' | grep -q '\.zip$'; then
            gh release download "$TAG" -R "$REPOSITORY" -D incoming-windows -p '*.zip' -p SHA256SUMS
          fi
          # The bucket is edited on the current default branch, whatever ref
          # this workflow was dispatched from.
          git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/bucket-base"
          git worktree add --detach "$RUNNER_TEMP/bucket" origin/bucket-base
          nix shell nixpkgs#python3 -c python3 scripts/scoop-manifest.py \
            --config "$CONFIG" --tag "$TAG" --release-dir incoming-windows \
            --bucket "$RUNNER_TEMP/bucket/bucket" | tee "$RUNNER_TEMP/scoop-outcome"
          echo "app=$(nix shell nixpkgs#python3 -c python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["app"])' "$CONFIG")" >> "$GITHUB_OUTPUT"
          if [ -n "$(git -C "$RUNNER_TEMP/bucket" status --porcelain -- bucket)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the manifest into the bucket
        if: steps.manifest.outputs.changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP: ${{ steps.manifest.outputs.app }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # See "Write the manifest": one Authorization header, checkout's.
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          cd "$RUNNER_TEMP/bucket"
          version="${TAG#v}"
          branch="scoop/$APP-$version-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git add bucket
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "scoop: $APP $version" \
              -m "From $REPOSITORY $TAG, verified against the release's SHA256SUMS."
          # Each attempt gets its own branch; retries preserve published history.
          expected_head=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$branch"
          if [ -z "$(gh pr list --head "$branch" --base "$BASE" --state open --json number -q '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$branch" --title "scoop: $APP $version" \
              --body "Scoop manifest for [$REPOSITORY $TAG](https://github.com/$REPOSITORY/releases/tag/$TAG), written by [publish-release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). The zip was verified against the release's \`SHA256SUMS\`."
          fi
          # GitHub computes mergeability asynchronously after the PR opens.
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$branch" --merge --match-head-commit "$expected_head" --delete-branch; then exit 0; fi
            echo "merge attempt $attempt did not succeed; retrying"
            sleep 15
          done
          echo "::error::could not merge the Scoop manifest PR for $branch"
          exit 1

      - name: Summary
        if: always() && steps.config.outputs.path
        run: |
          {
            echo "### Scoop bucket: $REPOSITORY $TAG"
            echo
            cat "$RUNNER_TEMP/scoop-outcome" 2>/dev/null || echo "no outcome recorded"
          } >> "$GITHUB_STEP_SUMMARY"
